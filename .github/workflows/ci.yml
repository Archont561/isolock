name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Developer tooling is separate from the explicit profile/platform materialization matrix.
jobs:
  quality:
    name: Code Quality and Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Formatting, Clippy, supply chain, and repository policy
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools quality all

  test-and-coverage:
    name: Hermetic Tests & Line Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Run Nextest Suite
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test nextest
      - name: Run BDD and Property Tests
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test bdd
      - name: Generate Code Coverage Report
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage/lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false

  profile-materialization:
    name: Offline profile ${{ matrix.profile }} / linux-64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [rust-pixi, rust-standalone]
    env:
      ISOLOCK_TEST_PROFILE: ${{ matrix.profile }}
      ISOLOCK_TEST_PLATFORM: linux-64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Materialize only the selected locked profile
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test profile-materialize

  product-acceptance:
    name: CLI, profile, and storage acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Exercise real-CLI registry and cold-storage journeys
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test acceptance

  release-artifact-smoke:
    name: Release artifact smoke / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: isolock
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary: isolock
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: isolock.exe
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build native release binary
        shell: bash
        run: sh tools/run release build-binary --target ${{ matrix.target }}
      - name: Package, checksum, extract, and smoke-test the binary
        shell: bash
        run: sh tools/run release host-smoke --platform ${{ matrix.platform }} --target ${{ matrix.target }} --binary ${{ matrix.binary }}
