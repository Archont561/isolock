name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Developer tooling is separate from the explicit profile/platform materialization matrix.
jobs:
  quality:
    name: Code Quality and Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Check Formatting
        run: .pixi/tools/linux-64/pixi run --as-is --offline cargo fmt --check
      - name: Run Clippy
        run: .pixi/tools/linux-64/pixi run --as-is --offline cargo clippy --workspace --all-targets --offline -- -D warnings
      - name: Supply Chain and License Audit
        run: .pixi/tools/linux-64/pixi run --as-is --offline cargo deny --offline check bans licenses sources

  test-and-coverage:
    name: Hermetic Tests & Line Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Run Nextest Suite
        run: .pixi/tools/linux-64/pixi run --as-is --offline cargo nextest run --workspace --offline
      - name: Run BDD and Property Tests
        run: .pixi/tools/linux-64/pixi run --as-is --offline cargo test --workspace --offline
      - name: Generate Code Coverage Report
        run: .pixi/tools/linux-64/pixi run --as-is --offline sh scripts/coverage.sh
      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage/lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false

  profile-materialization:
    name: Offline profile ${{ matrix.profile }} / linux-64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [rust-pixi, rust-standalone]
    env:
      ISOLOCK_TEST_PROFILE: ${{ matrix.profile }}
      ISOLOCK_TEST_PLATFORM: linux-64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Materialize only the selected locked profile
        shell: bash
        run: |
          set -euo pipefail
          export ISOLOCK_TEST_PIXI="$PWD/.pixi/tools/linux-64/pixi"
          export ISOLOCK_TEST_RUST_PREFIX="$PWD/.pixi/envs/default"
          case "$ISOLOCK_TEST_PROFILE" in
            rust-pixi) test=real_pixi_restores_the_selected_profile_from_a_cold_offline_cache ;;
            rust-standalone) test=real_standalone_rust_builds_a_locked_registry_dependency_offline ;;
            *) exit 2 ;;
          esac
          .pixi/tools/linux-64/pixi run --as-is --offline cargo test --package isolock --test real_profile --offline "$test" -- --ignored --nocapture
          if [ "$ISOLOCK_TEST_PROFILE" = rust-pixi ]; then
            .pixi/tools/linux-64/pixi run --as-is --offline cargo test --package isolock --test real_profile --offline real_pixi_conda_profile_roundtrips_through_git_storage_and_installs_offline -- --ignored --nocapture
          fi

  product-acceptance:
    name: CLI, profile, and storage acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh
      - name: Exercise real-CLI registry and cold-storage journeys
        run: >-
          .pixi/tools/linux-64/pixi run --as-is --offline cargo nextest run
          --package isolock --test cli_test --test epoch_rollover
          --test ingestion_profiles --offline

  release-artifact-smoke:
    name: Release artifact smoke / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: isolock
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary: isolock
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: isolock.exe
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build native release binary
        run: cargo build --release --locked --package isolock --target ${{ matrix.target }}
      - name: Package, checksum, extract, and smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "${{ matrix.target }}" || {
            echo "runner host $host cannot natively execute ${{ matrix.target }}" >&2
            exit 1
          }
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/stage" "$scratch/extracted"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$scratch/stage/${{ matrix.binary }}"
          archive="isolock-${{ matrix.platform }}.tar.gz"
          (cd "$scratch/stage" && tar -czf "$scratch/$archive" "${{ matrix.binary }}")
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$scratch" && sha256sum "$archive" > SHA256SUMS && sha256sum --check SHA256SUMS)
          else
            (cd "$scratch" && shasum -a 256 "$archive" > SHA256SUMS && shasum -a 256 --check SHA256SUMS)
          fi
          tar -xzf "$scratch/$archive" -C "$scratch/extracted"
          sh scripts/release-smoke.sh "$scratch/extracted/${{ matrix.binary }}"
