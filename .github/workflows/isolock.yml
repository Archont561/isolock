name: Isolock Airlock Guard & Ingestion

on:
  pull_request:
    paths:
      - ".github/workflows/isolock.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "pixi.lock"
      - "pixi.toml"
      - "package.json"
      - "requirements*.txt"
      - "isolock.toml"
      - "isolock.ingest.json"
      - "tools/**"
  workflow_dispatch:
    inputs:
      registry:
        description: "Target ecosystem registry (conda, pypi, npm, cargo)"
        required: true
        default: "cargo"
        type: choice
        options:
          - cargo
          - conda
          - pypi
          - npm
      packages:
        description: "Exact NAME==VERSION selections pinned in the reviewed manifest; no registry solving"
        required: true
        type: string
      manifest:
        description: "Tracked, reviewed artifact manifest at this code ref"
        required: true
        default: "isolock.ingest.json"
        type: string

concurrency:
  group: isolock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-guard:
    name: Published Airlock Snapshot Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh

      - name: Check for Isolock Storage Ref
        id: airlock-storage
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools airlock storage-ref

      - name: Build the snapshot auditor without registry access
        if: steps.airlock-storage.outputs.available == 'true'
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test build

      - name: Run Isolock Hermeticity Audit
        if: steps.airlock-storage.outputs.available == 'true'
        env:
          ISOLOCK_BIN: ${{ github.workspace }}/target/debug/isolock
          ISOLOCK_SNAPSHOT_REF: ${{ steps.airlock-storage.outputs.reference }}
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools airlock audit-snapshot

  ingest-dispatch:
    name: Airlock Package Ingestion
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh

      - name: Configure Git Author
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools airlock git-author

      - name: Build the CLI without registry access
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test build

      - name: Ingest and publish the reviewed selection
        env:
          ISOLOCK_BIN: ${{ github.workspace }}/target/debug/isolock
          ISOLOCK_INGEST_MANIFEST: ${{ inputs.manifest }}
          ISOLOCK_REGISTRY: ${{ inputs.registry }}
          ISOLOCK_PACKAGES: ${{ inputs.packages }}
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools airlock ingest
