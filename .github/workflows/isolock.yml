name: Isolock Airlock Guard & Ingestion

on:
  pull_request:
    paths:
      - ".github/workflows/isolock.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "pixi.lock"
      - "pixi.toml"
      - "package.json"
      - "requirements*.txt"
      - "isolock.toml"
      - "isolock.ingest.json"
  workflow_dispatch:
    inputs:
      registry:
        description: "Target ecosystem registry (conda, pypi, npm, cargo)"
        required: true
        default: "cargo"
        type: choice
        options:
          - cargo
          - conda
          - pypi
          - npm
      packages:
        description: "Exact NAME==VERSION selections pinned in the reviewed manifest; no registry solving"
        required: true
        type: string
      manifest:
        description: "Tracked, reviewed artifact manifest at this code ref"
        required: true
        default: "isolock.ingest.json"
        type: string

concurrency:
  group: isolock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-guard:
    name: Published Airlock Snapshot Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh

      - name: Check for Isolock Storage Ref
        id: airlock-storage
        run: |
          branch_ref="$(git ls-remote --heads origin refs/heads/isolock/v1)"
          tag_ref="$(git ls-remote --tags origin refs/tags/isolock/v1)"
          if [ -n "$branch_ref" ]; then
            git fetch origin refs/heads/isolock/v1:refs/remotes/origin/isolock/v1 --depth=1
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reference=refs/remotes/origin/isolock/v1" >> "$GITHUB_OUTPUT"
          elif [ -n "$tag_ref" ]; then
            git fetch origin refs/tags/isolock/v1:refs/tags/isolock/v1 --depth=1
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reference=refs/tags/isolock/v1" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No isolock/v1 storage ref exists; skipping published snapshot verification until storage is initialized."
          fi

      - name: Build the snapshot auditor without registry access
        if: steps.airlock-storage.outputs.available == 'true'
        run: .pixi/tools/linux-64/pixi run --as-is --offline cargo build --locked --offline --package isolock

      - name: Run Isolock Hermeticity Audit
        if: steps.airlock-storage.outputs.available == 'true'
        env:
          ISOLOCK_BIN: ${{ github.workspace }}/target/debug/isolock
          ISOLOCK_SNAPSHOT_REF: ${{ steps.airlock-storage.outputs.reference }}
        run: |
          set -euo pipefail
          snapshot=$(mktemp -d "$RUNNER_TEMP/isolock-snapshot.XXXXXX")
          trap 'rm -rf "$snapshot"' EXIT
          git archive "$ISOLOCK_SNAPSHOT_REF" | tar -x -C "$snapshot"
          cd "$snapshot"
          echo "Verifying the published plan and CAS, not solving project lockfiles."
          ISOLOCK_PLAN=plan.json "$ISOLOCK_BIN" plan --ci --cas-dir cas

  ingest-dispatch:
    name: Airlock Package Ingestion
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Restore reviewed developer tooling from CAS
        run: bash scripts/restore.sh

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build the CLI without registry access
        run: .pixi/tools/linux-64/pixi run --as-is --offline cargo build --locked --offline --package isolock

      - name: Ingest and publish the reviewed selection
        shell: bash
        env:
          ISOLOCK_BIN: ${{ github.workspace }}/target/debug/isolock
          ISOLOCK_INGEST_MANIFEST: ${{ inputs.manifest }}
          ISOLOCK_REGISTRY: ${{ inputs.registry }}
          ISOLOCK_PACKAGES: ${{ inputs.packages }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          binary = os.environ["ISOLOCK_BIN"]
          manifest = os.environ["ISOLOCK_INGEST_MANIFEST"]
          packages = os.environ["ISOLOCK_PACKAGES"].split()
          if not packages:
              raise SystemExit("An explicit reviewed package selection is required")
          subprocess.run(
              ["git", "ls-files", "--error-unmatch", "--", manifest],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          selection = ["--manifest", manifest, "--registry", os.environ["ISOLOCK_REGISTRY"]]
          # Literal argv and a separator prevent package text from becoming options or code.
          subprocess.run([binary, "ingest", *selection, "--download", "--", *packages], check=True)
          subprocess.run([binary, "push", *selection, "--", *packages], check=True)
          PYTHON
