name: Isolock Airlock Guard & Ingestion

on:
  pull_request:
    paths:
      - ".github/workflows/isolock.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "pixi.lock"
      - "pixi.toml"
      - "package.json"
      - "requirements*.txt"
      - "isolock.toml"
  workflow_dispatch:
    inputs:
      registry:
        description: "Target ecosystem registry (conda, pypi, npm, cargo)"
        required: true
        default: "cargo"
        type: choice
        options:
          - cargo
          - conda
          - pypi
          - npm
      packages:
        description: "Space-separated package specifications (e.g. clifacet==0.3.0 serde==1.0.210)"
        required: true
        type: string

concurrency:
  group: isolock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-guard:
    name: Airlock PR Drift Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Check for Isolock Storage Ref
        id: airlock-storage
        run: |
          branch_ref="$(git ls-remote --heads origin refs/heads/isolock/v1)"
          tag_ref="$(git ls-remote --tags origin refs/tags/isolock/v1)"
          if [ -n "$branch_ref" ]; then
            git fetch origin refs/heads/isolock/v1:refs/remotes/origin/isolock/v1 --depth=1
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$tag_ref" ]; then
            git fetch origin refs/tags/isolock/v1:refs/tags/isolock/v1 --depth=1
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No isolock/v1 storage ref exists; skipping the Airlock drift audit until storage is initialized."
          fi

      - name: Run Isolock Hermeticity Audit
        if: steps.airlock-storage.outputs.available == 'true'
        run: |
          echo "Auditing lockfile dependencies against airlock CAS..."
          # isolock plan outputs 'gh workflow run isolock.yml' when dependencies are missing
          cargo run --release --package isolock -- plan --ci

  ingest-dispatch:
    name: Airlock Package Ingestion
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ingest Packages into CAS
        run: |
          cargo run --release --package isolock -- ingest --registry "${{ inputs.registry }}" ${{ inputs.packages }}

      - name: Push Incremental Commit to Orphan Branch
        run: |
          cargo run --release --package isolock -- push
