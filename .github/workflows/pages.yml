name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages when available (set false for build-only run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Fumadocs Static Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install documentation dependencies
        shell: bash
        run: sh tools/run docs install

      - name: Build static Fumadocs export (docs/out)
        shell: bash
        run: sh tools/run docs build

      - name: Detect GitHub Pages availability
        shell: bash
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DEPLOY: ${{ inputs.deploy }}
        run: sh tools/run docs pages-status

      - name: Configure GitHub Pages
        if: ${{ steps.pages-status.outputs.enabled == 'true' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: ${{ steps.pages-status.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
