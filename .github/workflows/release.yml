name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (and publish only when publish is also enabled)"
        required: false
        type: string
      publish:
        description: "Publish this run's tag to Prefix.dev and GitHub Releases (defaults to a non-publishing rehearsal)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-acceptance:
    name: Required release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Restore reviewed developer tooling
        run: bash scripts/restore.sh
      - name: Check formatting, lint, and supply chain
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools quality all
      - name: Run unit, BDD, property, and CLI/storage acceptance
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test all

  release-profile-acceptance:
    name: Required release profile ${{ matrix.profile }} / linux-64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [rust-pixi, rust-standalone]
    env:
      ISOLOCK_TEST_PROFILE: ${{ matrix.profile }}
      ISOLOCK_TEST_PLATFORM: linux-64
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Restore reviewed developer tooling
        run: bash scripts/restore.sh
      - name: Exercise the selected offline locked-profile journey
        run: .pixi/tools/linux-64/pixi run --as-is --offline tools test profile-materialize

  build:
    needs: [release-acceptance, release-profile-acceptance]
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: isolock
            archive_name: isolock-linux-x86_64.tar.gz
            conda_arch: linux-64
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary_name: isolock
            archive_name: isolock-macos-arm64.tar.gz
            conda_arch: osx-arm64
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary_name: isolock.exe
            archive_name: isolock-windows-x86_64.tar.gz
            conda_arch: win-64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: latest
          run-install: false
          cache: false

      - name: Install rattler-build
        shell: bash
        run: sh tools/run release install-rattler-build

      - name: Validate manual publish tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: sh tools/run release check-tag

      - name: Build standalone Rust binary
        shell: bash
        run: sh tools/run release build-binary --target ${{ matrix.target }}

      - name: Stage standalone binary artifacts
        shell: bash
        run: sh tools/run release stage-binaries --platform ${{ matrix.platform }} --binary ${{ matrix.binary_name }} --archive-name ${{ matrix.archive_name }} --target ${{ matrix.target }}

      - name: Build Conda package
        shell: bash
        run: sh tools/run release build-conda --platform ${{ matrix.conda_arch }}

      - name: Checksum Conda package
        shell: bash
        run: sh tools/run release checksum-conda

      - name: Upload standalone binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: dist/binaries/*
          if-no-files-found: error

      - name: Upload Conda package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-${{ matrix.platform }}
          path: |
            dist/conda/**/*.conda
            dist/conda/SHA256SUMS
          if-no-files-found: error

  verify-release-artifacts:
    name: Verify standalone artifact / ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_name: isolock-linux-x86_64.tar.gz
            binary_name: isolock
          - os: macos-latest
            platform: macos-arm64
            archive_name: isolock-macos-arm64.tar.gz
            binary_name: isolock
          - os: windows-latest
            platform: windows-x86_64
            archive_name: isolock-windows-x86_64.tar.gz
            binary_name: isolock.exe
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: latest
          run-install: false
          cache: false
      - name: Download native standalone artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: dist/binaries
      - name: Verify checksums and smoke-test extracted release binary
        shell: bash
        run: sh tools/run release verify-binary --archive-name ${{ matrix.archive_name }} --binary ${{ matrix.binary_name }}

  verify-release-assets:
    name: Verify Conda packages and assemble release candidate
    needs: [build, verify-release-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: latest
          run-install: false
          cache: false
      - name: Download standalone artifacts without flattening
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist/binaries
      - name: Download Conda packages without flattening
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conda-*
          path: dist/conda
      - name: Verify package checksums, archive integrity, and assemble unique assets
        shell: bash
        run: sh tools/run release assemble-candidate
      - name: Upload verified release candidate (no publication)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish-conda:
    name: Publish Conda Packages to prefix.dev
    if: github.event_name == 'push' || inputs.publish == true
    needs: [verify-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prefix
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: latest
          run-install: false
          cache: false

      - name: Install rattler-build
        shell: bash
        run: sh tools/run release install-rattler-build

      - name: Download Conda package artifacts without flattening
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conda-*
          path: dist/conda

      - name: Verify GitHub OIDC permissions
        shell: bash
        run: sh tools/run release verify-oidc

      - name: Publish package to prefix.dev with trusted publishing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh tools/run release publish-conda --channel archont561/archont561

  publish-github:
    name: Publish GitHub Release
    if: github.event_name == 'push' || inputs.publish == true
    needs: [verify-release-assets, publish-conda]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download verified release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
