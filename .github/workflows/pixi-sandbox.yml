# Publishes the locked development tooling sandbox.
name: Publish developer sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'pixi-sandbox.toml'
      - 'scripts/restore.sh'
      - 'tools/**'
      - '.github/workflows/pixi-sandbox.yml'

permissions:
  contents: read

concurrency:
  group: pixi-sandbox-developer-${{ github.repository }}
  cancel-in-progress: false

env:
  PIXI_SANDBOX_VERSION: '0.9.0'

jobs:
  publish:
    name: Pack, verify, and publish developer linux-64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: latest
          run-install: false
          cache: false
      - name: Fetch and verify the pinned pixi-sandbox release
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox
        run: sh tools/run sandbox fetch-binary --version ${{ env.PIXI_SANDBOX_VERSION }} --output ${{ env.PIXI_SANDBOX_BIN }}
      - name: Pack, verify, and publish
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox
          PIXI_SANDBOX_PUSH_TOKEN: ${{ github.token }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: sh tools/run sandbox publish --platform linux-64 --branch sandbox/developer-clifacet-0-10-linux-64 --transport ${{ runner.temp }}/pixi-sandbox-transport --logs ${{ runner.temp }}/pixi-sandbox-logs
      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-developer-diagnostics
          path: ${{ runner.temp }}/pixi-sandbox-logs
          if-no-files-found: ignore
          retention-days: 7
