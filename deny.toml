[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [{ crate = "openssl-sys", reason = "Use pure-Rust TLS (rustls) rather than system OpenSSL" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0", # xxhash-rust
  "ISC",
  "Unicode-3.0",
  "Unlicense", # globreeks
  "MPL-2.0",
  "Zlib",
]

[advisories]
yanked = "deny"
# Transitive test/legacy unmaintained parser exceptions
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "Test-only rstest-bdd transitively requires unmaintained basic-toml; revisit on dependency update" },
  { id = "RUSTSEC-2024-0449", reason = "rattler_conda_types transitively pulls serde_yaml/unsafe-libyaml for legacy meta.yaml compatibility" },
]
