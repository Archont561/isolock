[workspace]
name = "isolock"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]
# PyPI dependencies below are standalone CLIs and need no Conda/PyPI alias mapping.
conda-pypi-map = false

[dependencies]
actionlint = "==1.7.12"
bun = "==1.4.2"
cargo-audit = "==0.22.1"
cargo-deny = "==0.20.2"
cargo-llvm-cov = ">=0.9.1,<0.10"
cargo-nextest = ">=0.9.150,<0.10"
convco = "==0.7.2"
lefthook = "==2.2.2"
lychee = "==0.24.2"
python = ">=3.9,<4"
rattler-build = "==0.72.2"
rust = ">=1.88.0"
shellcheck = "==0.11.0"
vale = "==3.19.0"

[pypi-dependencies]
alint = "==0.22.1"
rumdl = "==0.3.4"

[activation.env]
LLVM_COV = "$CONDA_PREFIX/bin/llvm-cov"
LLVM_PROFDATA = "$CONDA_PREFIX/bin/llvm-profdata"

[tasks]
install-hooks = "lefthook install"
build = "cargo build --workspace"
test = "cargo test --workspace --all-features"
nextest = "cargo nextest run --workspace --all-features"
coverage = "cargo llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info"
coverage-summary = "cargo llvm-cov --workspace --all-features --text"
build-conda = "rattler-build build --recipe crates/isolock/recipe.yaml --output-dir dist/conda"
publish-conda = "rattler-build upload prefix --channel archont561/archont561 --generate-attestation --store-github-attestation --skip-existing dist/conda/**/*.conda"
