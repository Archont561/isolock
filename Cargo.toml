[workspace]
resolver = "2"
members = [
    "crates/isolock-core",
    "crates/isolock-cas",
    "crates/isolock-plan",
    "crates/isolock-proxy",
    "crates/isolock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Archont561"]
repository = "https://github.com/Archont561/isolock"

[workspace.dependencies]
isolock = { path = "crates/isolock", version = "=0.1.0" }
isolock-core = { path = "crates/isolock-core", version = "=0.1.0" }
isolock-cas = { path = "crates/isolock-cas", version = "=0.1.0" }
isolock-plan = { path = "crates/isolock-plan", version = "=0.1.0" }
isolock-proxy = { path = "crates/isolock-proxy", version = "=0.1.0" }
clifacet = "0.5.0"
clap = { version = "4.6", features = ["derive"] }
brotli = "9.1"
sha2 = "0.11"
hex = "0.4.3"
flate2 = "1.0"
tar = "0.4"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
rattler_conda_types = { version = "0.58.4", default-features = false }
tame-index = { version = "0.27.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.12.0"
rstest = "0.28.0"
rstest-bdd = "=0.6.0"
rstest-bdd-macros = "=0.6.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.cargo]
unused_dependencies = "allow"
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
