    "features/",
    "tests/*_bdd.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Build one CLI command; run it noninteractive, as a questionnaire, or as a TUI"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Archont561/clifacet"

[features]
