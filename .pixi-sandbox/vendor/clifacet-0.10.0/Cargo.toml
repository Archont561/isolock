[dependencies.clap]
version = "4.6.7"
features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
    "env",
    "string",
]
default-features = false

[dependencies.clifacet-macros]
version = "0.10.0"

[dependencies.crossterm]
version = "0.29.0"
features = ["event-stream"]
optional = true

[dependencies.figment]
version = "0.10.19"
optional = true
default-features = false

[dependencies.futures-core]
version = "0.3.34"
optional = true
default-features = false

[dependencies.inquire]
version = "0.9.4"
features = ["crossterm"]
optional = true
default-features = false

[dependencies.minijinja]
version = "3.1.0"
features = [
    "builtins",
    "serde",
]
optional = true
default-features = false

[dependencies.ratatui]
version = "0.30.2"
features = ["crossterm_0_29"]
optional = true
default-features = false

[dependencies.serde]
version = "1.0.229"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0.154"
optional = true

[dependencies.thiserror]
version = "2.0.21"

[dependencies.tokio]
version = "1.54.1"
features = [
    "rt",
    "rt",
    "rt-multi-thread",
    "signal",
    "time",
    "macros",
    "sync",
]
optional = true
default-features = false

[dependencies.toml_edit]
version = "0.25.17"
features = ["parse"]
optional = true
default-features = false

[dev-dependencies.assert_cmd]
version = "2.2.2"

[dev-dependencies.rstest]
version = "0.28.0"

[dev-dependencies.rstest-bdd]
version = "=0.6.0"

[dev-dependencies.rstest-bdd-macros]
version = "=0.6.0"

[dev-dependencies.serde_json]
version = "1.0.154"

[dev-dependencies.tokio]
version = "1.54.1"
features = [
    "rt",
    "rt",
    "macros",
    "test-util",
]
default-features = false

[dev-dependencies.trybuild]
version = "1.0.122"

[lints.clippy.pedantic]
level = "warn"
