# Lefthook Git hooks configuration for isolock

commit-msg:
  commands:
    convco:
      run: convco check --from-stdin --strip < {1}

pre-commit:
  parallel: true
  commands:
    alint:
      run: alint

    fmt:
      glob: "*.rs"
      run: cargo fmt --check

    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint

    shellcheck:
      glob: "**/*.sh"
      run: shellcheck {staged_files}

    rumdl:
      glob: "**/*.{md,mdx}"
      run: rumdl check

    lychee:
      glob: "**/*.{md,mdx}"
      run: lychee --config lychee.toml {staged_files}

    vale:
      glob: "{README.md,AGENTS.md,backlog/**/*.md,docs/**/*.{md,mdx}}"
      run: vale --config .vale.ini {staged_files}

pre-push:
  parallel: true
  commands:
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    test:
      run: cargo nextest run --workspace
    deny:
      run: cargo deny check bans licenses sources
