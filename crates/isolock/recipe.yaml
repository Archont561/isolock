schema_version: 1

context:
  name: isolock
  version: 0.1.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  script:
    - if: unix
      then: cargo install --no-track --locked --root "${PREFIX}" --path crates/isolock
      else: cargo install --no-track --locked --root "%PREFIX%" --path crates/isolock

requirements:
  build:
    - ${{ compiler('c') }}
    - rust

tests:
  - script:
      - isolock --version
      - isolock --help
      - isolock config check
      # Representative documented command: the drift verdict, hermetic on an empty plan.
      - if: unix
        then: |
          tmp=$(mktemp -d)
          printf '{"artifacts":[]}' > "$tmp/plan.json"
          ISOLOCK_PLAN="$tmp/plan.json" ISOLOCK_CAS_DIR="$tmp/cas" HOME="$tmp" isolock plan --ci | grep -q "Verdict: ALL DEPENDENCIES SATISFIED"
      - if: win
        then: |
          mkdir %TEMP%\isolock-recipe-test
          echo {"artifacts":[]} > %TEMP%\isolock-recipe-test\plan.json
          set ISOLOCK_PLAN=%TEMP%\isolock-recipe-test\plan.json
          set ISOLOCK_CAS_DIR=%TEMP%\isolock-recipe-test\cas
          isolock plan --ci | findstr /C:"Verdict: ALL DEPENDENCIES SATISFIED"

about:
  summary: Dedicated dependency airlock manager
  license: MIT OR Apache-2.0
  homepage: https://github.com/Archont561/isolock
  repository: https://github.com/Archont561/isolock
