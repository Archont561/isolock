# Vale prose linter configuration with vendored presets (Microsoft, proselint, write-good, alex, Readability, Google).

StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft, proselint, write-good, alex, Readability, Google
Vocab = Isolock

[*.{md,mdx}]
BasedOnStyles = Microsoft, proselint, write-good, alex, Polyglot
Vale.Spelling = NO
Vale.Terms = NO
Microsoft.Terms = NO
Microsoft.Headings = NO
Microsoft.Acronyms = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Passive = NO
Microsoft.Contractions = NO
Microsoft.Foreign = NO
Microsoft.GeneralURL = NO
Microsoft.We = NO
Microsoft.Ellipses = NO
Polyglot.HeadingCase = NO
alex.Condescending = NO
alex.ProfanityUnlikely = NO
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.Weasel = NO
proselint.Very = NO
proselint.Typography = NO
